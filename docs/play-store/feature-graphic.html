<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Feature Graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #07050A;
    position: relative;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #F2ECE4;
  }
  /* Radial red glow anchoring the spider */
  .glow {
    position: absolute; top: -100px; left: 100px;
    width: 900px; height: 900px;
    background: radial-gradient(circle at center, rgba(255,23,68,0.45), rgba(176,21,35,0.18) 40%, transparent 70%);
  }
  /* Hex honeycomb */
  .hex {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: radial-gradient(circle at 30px 30px, #B01523 1.5px, transparent 2px);
    background-size: 40px 40px;
  }
  .spider {
    position: absolute; top: 90px; left: 190px;
    width: 340px; height: 340px;
  }
  .title-block {
    position: absolute; right: 80px; top: 130px; width: 460px;
  }
  h1 {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 68px; line-height: 0.95;
    color: #FFD54F; letter-spacing: 6px;
    text-shadow: 0 4px 30px rgba(255,213,79,0.35);
  }
  h2 {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 68px; line-height: 0.95;
    color: #E8EBEF; letter-spacing: 6px; margin-top: 4px;
  }
  .tag {
    font-style: italic; font-size: 20px; color: #FF1744;
    letter-spacing: 2px; margin-top: 22px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(90deg, #B8863A, #FFD54F);
    color: #07050A; padding: 12px 22px; border-radius: 999px;
    font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 3px;
    font-size: 18px; margin-top: 32px;
    box-shadow: 0 8px 32px rgba(255,213,79,0.4);
  }
  .pill svg { width: 22px; height: 22px; }
  .kicker {
    position: absolute; bottom: 32px; left: 80px;
    font-size: 13px; color: #8A7F82; letter-spacing: 4px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="hex"></div>

  <svg class="spider" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
    <line x1="160" y1="10" x2="160" y2="120" stroke="#B8BCC4" stroke-width="1.5" opacity="0.55"/>
    <defs>
      <radialGradient id="rg"><stop offset="0" stop-color="#FF1744" stop-opacity="0.42"/><stop offset="0.5" stop-color="#B01523" stop-opacity="0.18"/><stop offset="1" stop-color="#B01523" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="160" cy="180" r="145" fill="url(#rg)"/>
    <g stroke="#B01523" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M148,175 L96,142 L64,168"/><path d="M146,184 L86,180 L56,208"/><path d="M146,204 L98,224 L72,262"/><path d="M150,220 L118,262 L108,297"/>
      <path d="M172,175 L224,142 L256,168"/><path d="M174,184 L234,180 L264,208"/><path d="M174,204 L222,224 L248,262"/><path d="M170,220 L202,262 L212,297"/>
    </g>
    <circle cx="160" cy="196" r="34" fill="#07050A"/>
    <circle cx="160" cy="196" r="34" fill="none" stroke="#FF1744" stroke-width="2" opacity="0.72"/>
    <circle cx="160" cy="158" r="19" fill="#07050A"/>
    <circle cx="160" cy="158" r="19" fill="none" stroke="#FF1744" stroke-width="1.6" opacity="0.72"/>
    <circle cx="152" cy="150" r="4.5" fill="#E8EBEF" opacity="0.5"/>
    <line x1="154" y1="174" x2="152" y2="180" stroke="#B8BCC4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="166" y1="174" x2="168" y2="180" stroke="#B8BCC4" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="153" cy="154" r="9" fill="#FF1744" opacity="0.38"/>
    <circle cx="167" cy="154" r="9" fill="#FF1744" opacity="0.38"/>
    <circle cx="153" cy="154" r="3.4" fill="#FF1744"/>
    <circle cx="167" cy="154" r="3.4" fill="#FF1744"/>
  </svg>

  <div class="title-block">
    <h1>HANGING</h1>
    <h2>SPIDER</h2>
    <p class="tag">bind the beast · earn the bounty</p>
    <div class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="#07050A" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 11h18M8 15h3" stroke-linecap="round"/></svg>
      REAL AMAZON GIFT CARDS
    </div>
  </div>

  <div class="kicker">a word-hunt game · sync across devices · 12+</div>
</body>
</html>
